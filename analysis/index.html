<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Заявка</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      background: #181818;
      color: #fff;
      font-family: 'Ubuntu', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    h1 {
      margin-top: 40px;
      margin-bottom: 24px;
      font-size: 2em;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
    }
    .form-container {
      background: #232323;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      padding: 32px 24px 24px 24px;
      max-width: 380px;
      width: 100%;
      margin-bottom: 40px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    input, textarea {
      background: #181818;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      font-size: 1em;
      transition: border 0.2s;
      resize: none;
    }
    input:focus, textarea:focus {
      border: 1.5px solid #007acc;
      outline: none;
      background: #222;
    }
    textarea {
      min-height: 80px;
      max-height: 200px;
    }
    button[type="submit"] {
      background: linear-gradient(90deg, #007acc 0%, #005fa3 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 14px 0;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0,122,204,0.10);
      letter-spacing: 0.5px;
    }
    button[type="submit"]:hover {
      background: linear-gradient(90deg, #005fa3 0%, #007acc 100%);
      box-shadow: 0 4px 16px rgba(0,122,204,0.18);
    }
    .form-status {
      margin-top: 10px;
      min-height: 22px;
      font-size: 1em;
      text-align: center;
    }
    @media (max-width: 500px) {
      .form-container {
        padding: 18px 6vw 18px 6vw;
      }
      h1 {
        font-size: 1.3em;
      }
    }
  </style>
</head>
<body>

  <h1>Оставить заявку</h1>
  <div class="form-container">
    <form id="contactForm" autocomplete="off">
      <input type="text" name="name" placeholder="Ваше имя" required />
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="message" placeholder="Ваше сообщение" required></textarea>
      <button type="submit">Отправить</button>
      <div class="form-status" id="form-status"></div>
    </form>
  </div>

<script>
  const form = document.getElementById('contactForm');
  const status = document.getElementById('form-status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.textContent = 'Отправка...';

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    try {
      const res = await fetch('/api/sendMail', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      if (res.ok) {
        status.textContent = 'Сообщение отправлено!';
        form.reset();
      } else {
        status.textContent = 'Ошибка при отправке.';
      }
    } catch {
      status.textContent = 'Ошибка сети.';
    }
  });
</script>
</body>
</html>
