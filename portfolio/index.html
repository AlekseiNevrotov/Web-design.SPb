<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Портфолио студии</title>
  <link rel="icon" href="/favicons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500;700&family=Ubuntu:wght@300;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mylogo: #26D9CD;
      --accent: #26D97C;
      --myinterface: #16847D;
      --bg: #121212;
      --black2: #191919;
      --black3: #1C1C1C;
      --grey: #404040;
      --grey2: #666666;
      --text: #FFFFFF;
      --radius: 32px;
    }
    body {
      margin: 0;
      font-family: 'DM Sans', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 48px 16px 32px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Ubuntu', Arial, sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }
    ul {
      list-style: none;
      padding: 0;
      width: 100%;
      margin: 0;
    }
    li {
      margin-bottom: 18px;
    }
    .portfolio-link {
      display: block;
      width: 100%;
      background: var(--black3);
      color: var(--text);
      text-decoration: none;
      border-radius: 18px;
      border: 1.5px solid var(--black2);
      padding: 22px 24px;
      font-size: 1.08rem;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(38,217,205,0.07);
      transition: background 0.2s, color 0.2s, border 0.2s;
      letter-spacing: 0.01em;
    }
    .portfolio-link:hover {
      background: var(--accent);
      color: var(--black3);
      border-color: var(--accent);
    }
    @media (max-width: 600px) {
      main {
        padding: 24px 4vw 24px 4vw;
      }
      h1 {
        font-size: 1.2em;
        margin-bottom: 20px;
      }
      .portfolio-link {
        padding: 14px 10px;
        border-radius: 12px;
        font-size: 1em;
      }
      li {
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Портфолио нашей студии</h1>
    <ul>
      <li><a class="portfolio-link" href="https://artplacejungle.tilda.ws/" target="_blank">Тайм кафе</a></li>
      <li><a class="portfolio-link" href="https://primer-site2.ru" target="_blank">Сайт 2 – лендинг по недвижимости</a></li>
      <li><a class="portfolio-link" href="https://primer-site3.ru" target="_blank">Сайт 3 – сайт портфолио фотографа</a></li>
    </ul>
  </main>
</body>
</html>
