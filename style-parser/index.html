<style>
    :root {
      --mylogo: #26D9CD;
      --accent: #26D97C;
      --myinterface: #16847D;
      --bg: #121212;
      --black2: #191919;
      --black3: #1C1C1C;
      --grey: #404040;
      --grey2: #666666;
      --text: #FFFFFF;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      max-width: 100%;
      margin: 0; 
      padding: 0px 24px 0px 24px;
    }
    h1 {
      font-family: 'Ubuntu', Arial, sans-serif;
      font-weight: 300;
      margin-bottom: 12px;
      margin-top: 20px;
      font-size: 48px;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }
    input, button {
      width: 100%;
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid var(--bg);
      border-radius: 24px;
      font-size: 16px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
    border: 1px solid var(--myinterface); 
}
    input {
      background: var(--black3);
      color: var(--text);
      width: 100%;
      display: block;
      margin: 0 auto;
    }
    input, button {
  box-sizing: border-box; 
  display: block; 
}
    button {
      width: auto;
      padding: 16px 32px;
      border-radius: 60px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      border: 1px solid var(--accent);
      transition: all 0.4s ease;
      font-size: 16px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      display: block;
      margin: 0 auto;
      margin-top: 20px;
    }
    button:hover {
      border: 1px solid var(--accent);
      background: var(--bg);
      color: var(--accent);
    }
    button:active {
  border: 1px solid var(--myinterface);
  background: var(--bg); 
  color: var(--myinterface);                
  transform: scale(0.96);  
    }
    #result {
      background: var(--bg);
      color: var(--text);
      margin-top: 12px;
      font-size: 16px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      min-height: 40px;
      word-break: break-all;
    }
    pre {
      background: var(--bg);
      color: var(--text);
      border-radius: 20px;
      margin-top: 24px;
      font-size: 1em;
      overflow-x: auto;
    }
    .error {
      color: var(--accent);
    }
    #preloader {
            position: fixed;
            align-items: center; 
            justify-content: center; 
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.4s;
        }
        #preloader.hide {
            opacity: 0;
            pointer-events: none;
        }
       .spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%; 
    border: 4px solid transparent; 
    border-top-color: var(--myinterface); 
    animation: spin 0.4s linear infinite; 
}
@keyframes spin {
    0% {
        transform: rotate(0deg); 
    }
    100% {
        transform: rotate(360deg);
    }
}
@media (max-width: 1000px) {
  h1 {
      font-family: 'Ubuntu', Arial, sans-serif;
      font-weight: 300;
      margin-bottom: 12px;
      margin-top: 40px;
      font-size: 28px;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }
    input {

      color: var(--text);
      width: 100%;

    }
  }

<body>
  <div id="preloader">
        <div>
            <div class="spinner"></div>
        </div>
    </div>
  <h1>Парсер стиля</h1>
  <input type="text" id="urlInput" placeholder="Введите URL сайта">
  <button onclick="parseStyle()">Получить CSS</button>
  <div id="result"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
  const preloader = document.getElementById('preloader');
  if (preloader && !localStorage.getItem('preloaderShown')) {
    document.body.style.overflow = 'hidden';
    function hidePreloaderWhenFontsReady() {
      if (document.fonts && document.fonts.check('1em "DM Sans"') && document.fonts.check('1em Ubuntu')) {
        setTimeout(() => {
          preloader.classList.add('hide');
          document.body.style.overflow = '';
          localStorage.setItem('preloaderShown', '1');
        }, 2000);
      } else {
        setTimeout(hidePreloaderWhenFontsReady, 50);
      }
    }
    hidePreloaderWhenFontsReady();
  } else if (preloader) {
    preloader.classList.add('hide');
    document.body.style.overflow = '';
  }
});
  </script>
  <script>
    async function parseStyle() {
      let url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      if (!url) {
        resultDiv.innerHTML = '<span class="error">Введите URL!</span>';
        return;
      }
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      resultDiv.textContent = 'Загрузка...';
      try {
        const response = await fetch('https://style-parser.vercel.app/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Ошибка API');
        resultDiv.innerHTML = '';
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.className = 'css';
        code.textContent = data.css || 'CSS не найден';
        pre.appendChild(code);
        resultDiv.appendChild(pre);
        hljs.highlightElement(code);
      } catch (e) {
        resultDiv.innerHTML = `<span class="error">Ошибка: ${e.message}</span>`;
      }
    }
  </script>
</body>
