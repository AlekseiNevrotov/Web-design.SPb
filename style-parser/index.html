<body>
  <div id="preloader">
        <div>
            <div class="spinner"></div>
        </div>
    </div>
  <h1>Парсер стиля</h1>
  <input type="text" id="urlInput" placeholder="Введите URL сайта">
  <button onclick="parseStyle()">Получить код</button>
  <div id="result"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
  const preloader = document.getElementById('preloader');
  if (preloader && !localStorage.getItem('preloaderShown')) {
    document.body.style.overflow = 'hidden';
    function hidePreloaderWhenFontsReady() {
      if (document.fonts && document.fonts.check('1em "DM Sans"') && document.fonts.check('1em Ubuntu')) {
        setTimeout(() => {
          preloader.classList.add('hide');
          document.body.style.overflow = '';
          localStorage.setItem('preloaderShown', '1');
        }, 1200);
      } else {
        setTimeout(hidePreloaderWhenFontsReady, 50);
      }
    }
    hidePreloaderWhenFontsReady();
  } else if (preloader) {
    preloader.classList.add('hide');
    document.body.style.overflow = '';
  }
});
  </script>
  <script>
    async function parseStyle() {
      let url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      if (!url) {
        resultDiv.innerHTML = '<span class="error">Введите URL!</span>';
        return;
      }
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      resultDiv.textContent = 'Загрузка...';
      try {
        const response = await fetch('https://style-parser.vercel.app/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Ошибка API');
        resultDiv.innerHTML = '';
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.className = 'css';
        code.textContent = data.css || 'CSS не найден';
        pre.appendChild(code);
        resultDiv.appendChild(pre);
        hljs.highlightElement(code);
      } catch (e) {
        resultDiv.innerHTML = `<span class="error">${e.message}</span>`;
      }
    }
  </script>
