<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Парсер стиля (API)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
  <style>
    body {
      background: #181818;
      color: #fff;
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      font-size: 1.3em;
      margin-bottom: 1em;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      font-size: 1em;
    }
    input {
      background: #232323;
      color: #fff;
    }
    button {
      background: #26D97C;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #005fa3;
    }
    #result {
      background: #232323;
      color: #fff;
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
      font-size: 0.95em;
      min-height: 40px;
      word-break: break-all;
    }
    pre {
      background: #232323;
      color: #fff;
      border-radius: 4px;
      padding: 10px;
      margin: 0;
      font-size: 0.95em;
      overflow-x: auto;
    }
    .error {
      color: #ff5555;
    }
  </style>
</head>
<body>
  <h1>Парсер стиля</h1>
  <input type="text" id="urlInput" placeholder="Введите URL сайта">
  <button onclick="parseStyle()">Получить CSS</button>
  <div id="result"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    async function parseStyle() {
      let url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      if (!url) {
        resultDiv.innerHTML = '<span class="error">Введите URL!</span>';
        return;
      }
      // Добавляем https:// если пользователь не указал протокол
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      resultDiv.textContent = 'Загрузка...';
      try {
        const response = await fetch('https://style-parser.vercel.app/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Ошибка API');
        // Структурированный вывод с подсветкой синтаксиса
        resultDiv.innerHTML = '';
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.className = 'css';
        code.textContent = data.css || 'CSS не найден';
        pre.appendChild(code);
        resultDiv.appendChild(pre);
        hljs.highlightElement(code);
      } catch (e) {
        resultDiv.innerHTML = `<span class="error">Ошибка: ${e.message}</span>`;
      }
    }
  </script>
</body>
</html>
