<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Парсер стиля (API)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
  <style>
    :root {
      --mylogo: #26D9CD;
      --accent: #26D97C;
      --myinterface: #16847D;
      --bg: #121212;
      --black2: #191919;
      --black3: #1C1C1C;
      --grey: #404040;
      --grey2: #666666;
      --text: #FFFFFF;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 0px auto;
      padding: 20px;
    }
    h1 {
      font-family: 'Ubuntu', Arial, sans-serif;
      font-weight: 300;
      margin-bottom: 12px;
      margin-top: 0px;
      font-size: 48px;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }
    input, button {
      width: 100%;
      padding: 20px;
      margin-bottom: 10px;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
    }
    input {
      background: var(--black3);
      color: var(--text);
      width: 100%;
    }
    input, button, #result {
  box-sizing: border-box; 
  display: block; 
}
    button {
      width: auto;
      padding: 16px 32px;
      border-radius: 60px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      border: 1px solid var(--accent);
      transition: all 0.4s ease;
      font-size: 16px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      display: block;
      margin: 0 auto;
    }
    button:hover {
      border: 1px solid var(--accent);
      background: var(--bg);
      color: var(--accent);
    }
    button:active {
  border: 1px solid var(--myinterface);
  background: var(--bg); 
  color: var(--myinterface);                
  transform: scale(0.96);  
    }
    #result {
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      margin-top: 10px;
      font-size: 0.95em;
      min-height: 40px;
      word-break: break-all;
    }
    pre {
      background: var(--bg);
      color: var(--text);
      border-radius: 4px;
      padding: 10px;
      margin: 0;
      font-size: 0.95em;
      overflow-x: auto;
    }
    .error {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>Парсер стиля</h1>
  <input type="text" id="urlInput" placeholder="Введите URL сайта">
  <button onclick="parseStyle()">Получить CSS</button>
  <div id="result"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    async function parseStyle() {
      let url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      if (!url) {
        resultDiv.innerHTML = '<span class="error">Введите URL!</span>';
        return;
      }
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      resultDiv.textContent = 'Загрузка...';
      try {
        const response = await fetch('https://style-parser.vercel.app/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Ошибка API');
        resultDiv.innerHTML = '';
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.className = 'css';
        code.textContent = data.css || 'CSS не найден';
        pre.appendChild(code);
        resultDiv.appendChild(pre);
        hljs.highlightElement(code);
      } catch (e) {
        resultDiv.innerHTML = `<span class="error">Ошибка: ${e.message}</span>`;
      }
    }
  </script>
</body>
</html>
