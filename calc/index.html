<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Заявка</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      background: #181818;
      color: #fff;
      font-family: 'Ubuntu', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    h1 {
      margin-top: 40px;
      margin-bottom: 24px;
      font-size: 2em;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
    }
    .form-container {
      background: #232323;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      padding: 32px 24px 24px 24px;
      max-width: 380px;
      width: 100%;
      margin-bottom: 40px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    input, textarea {
      background: #181818;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      font-size: 1em;
      transition: border 0.2s;
      resize: none;
    }
    input:focus, textarea:focus {
      border: 1.5px solid #007acc;
      outline: none;
      background: #222;
    }
    textarea {
      min-height: 80px;
      max-height: 200px;
    }
    button[type="submit"] {
      background: linear-gradient(90deg, #007acc 0%, #005fa3 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 14px 0;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0,122,204,0.10);
      letter-spacing: 0.5px;
    }
    button[type="submit"]:hover {
      background: linear-gradient(90deg, #005fa3 0%, #007acc 100%);
      box-shadow: 0 4px 16px rgba(0,122,204,0.18);
    }
    .form-status {
      margin-top: 10px;
      min-height: 22px;
      font-size: 1em;
      text-align: center;
    }
        label {
      display: block;
      margin: 15px 0 5px;
    }
    .total {
      margin-top: 20px;
      font-size: 1.5em;
      font-weight: bold;
    }
    @media (max-width: 500px) {
      .form-container {
        padding: 18px 6vw 18px 6vw;
      }
      h1 {
        font-size: 1.3em;
      }
    }
  </style>
</head>
<body>
  <label>Количество страниц: <span id="pagesValue">1</span></label>
  <input type="range" id="pages" min="1" max="20" value="1">

  <label>
    <input type="checkbox" id="design"> Дизайн
  </label>
  <label>
    <input type="checkbox" id="adaptive"> Адаптивность
  </label>
  <label>
    <input type="checkbox" id="cms"> CMS (админка)
  </label>

  <div class="total">Итого: <span id="total">0</span> ₽</div>

  <script>
    const pages = document.getElementById('pages');
    const pagesValue = document.getElementById('pagesValue');
    const design = document.getElementById('design');
    const adaptive = document.getElementById('adaptive');
    const cms = document.getElementById('cms');
    const total = document.getElementById('total');

    function calculate() {
      let cost = pages.value * 2000;

      if (design.checked) cost += 5000;
      if (adaptive.checked) cost += 3000;
      if (cms.checked) cost += 7000;

      pagesValue.textContent = pages.value;
      total.textContent = cost.toLocaleString();

      // Обновляем скрытые поля
      document.getElementById('pages_count').value = pages.value;
      document.getElementById('design_selected').value = design.checked ? 'Да' : 'Нет';
      document.getElementById('adaptive_selected').value = adaptive.checked ? 'Да' : 'Нет';
      document.getElementById('cms_selected').value = cms.checked ? 'Да' : 'Нет';
      document.getElementById('total_cost').value = cost;
    }

    pages.addEventListener('input', calculate);
    design.addEventListener('change', calculate);
    adaptive.addEventListener('change', calculate);
    cms.addEventListener('change', calculate);

    calculate(); // начальный расчёт
  </script>
 
  
    
      
        <form id="auditForm">
          <input type="text" name="name" placeholder="Ваше имя" required>
          <input type="email" name="email" placeholder="Email" required>
          <textarea name="message" placeholder="Комментарий" rows="3"></textarea>
          <!-- Скрытые поля должны быть здесь -->
          <input type="hidden" name="pages_count" id="pages_count">
          <input type="hidden" name="design_selected" id="design_selected">
          <input type="hidden" name="adaptive_selected" id="adaptive_selected">
          <input type="hidden" name="cms_selected" id="cms_selected">
          <input type="hidden" name="total_cost" id="total_cost">
          <button type="submit">Отправить</button>
        </form>
        <div id="form-status"></div>
    

  <script>
    function openModal() {
      document.getElementById('modal-bg').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('modal-bg').style.display = 'none';
      document.getElementById('form-status').innerText = '';
      document.getElementById('auditForm').reset();
    }

    document.getElementById('auditForm').onsubmit = async function(e) {
      e.preventDefault();
      const status = document.getElementById('form-status');
      status.innerText = 'Отправка...';

      const form = e.target;
      const data = {
        name: form.name.value,
        email: form.email.value,
        message: form.message.value,
        pages_count: form.pages_count.value,
        design_selected: form.design_selected.value,
        adaptive_selected: form.adaptive_selected.value,
        cms_selected: form.cms_selected.value,
        total_cost: form.total_cost.value
      };

      try {
        const res = await fetch('/api/sendMail', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
        if (res.ok) {
          status.innerText = 'Спасибо за заявку!';
          setTimeout(closeModal, 1500);
        } else {
          status.innerText = 'Ошибка при отправке. Попробуйте позже.';
        }
      } catch {
        status.innerText = 'Ошибка сети. Попробуйте позже.';
      }
    };
  </script>
  
</body>
</html>
