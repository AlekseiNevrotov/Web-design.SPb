  <title>Калькулятор стоимости сайта</title>
  <meta name="keywords" content="Веб-дизайн, создание сайтов, создание сайтов спб, заказать сайт, разработка сайтов под ключ">
  <meta name="description" content="Расчитайте стоимость веб-дизайна и создания сайта под ключ. Узнайте сколько стоит заказать сайт. Разработка сайтов." />

<body>
  <div class="preloader">
    <div class="spinner"></div>
  </div>
  <div class="calc-container">
    <div class="columns-wrapper">
      <div class="left-column">
        <label>Выберите количество страниц:<span id="pagesValue">1</span></label>
        <input type="range" id="pages" min="1" max="20" value="1">
        <div class="checkbox-group">
          <label><input type="checkbox" id="design"> Дизайн</label>
          <label><input type="checkbox" id="adaptive"> Адаптивность</label>
          <label><input type="checkbox" id="crm"> CRM</label>
          <label><input type="checkbox" id="dop"> Кастомизация</label>
          <label><input type="checkbox" id="seo"> SEO</label>
          <label class="toggle">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider"></span>
    </label>
    <div class="status"><span id="toggleStatus"></span></div>
        </div>
        <div class="total">Примерная стоимость до <span id="total">0</span> ₽</div>
      </div>
      <div class="right-column">
        <form id="auditForm">
          <input type="text" name="name" placeholder="Имя">
          <input type="text" id="phone" placeholder="+7 (___) ___-__-__" maxlength="18" autocomplete="off">
          <textarea name="message" placeholder="Брифинг" rows="3"></textarea>
          <input type="hidden" name="pages_count" id="pages_count">
          <input type="hidden" name="design_selected" id="design_selected">
          <input type="hidden" name="adaptive_selected" id="adaptive_selected">
          <input type="hidden" name="crm_selected" id="crm_selected">
          <input type="hidden" name="dop_selected" id="dop_selected">
          <input type="hidden" name="seo_selected" id="seo_selected">
          <input type="hidden" name="total_cost" id="total_cost">
          <div class="button-status-wrapper"><button type="submit">Заказать</button>
          <div id="form-status"></div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
