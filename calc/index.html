<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Калькулятор стоимости — Web-design.SPb</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300&family=Ubuntu:wght@300&display=swap" rel="stylesheet">
  <style>
    :root {
      --mylogo: #26D9CD;
      --accent: #26D97C;
      --myinterface: #16847D;
      --bg: #121212;
      --black2: #191919;
      --black3: #1C1C1C;
      --grey: #404040;
      --grey2: #666666;
      --text: #FFFFFF;
      --radius: 20px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .calc-container {
      background: var(--black3);
      border-radius: var(--radius);
      box-shadow: 4px 0px 8px var(--black2);
      padding: 24px 24px 24px 24px;
      margin: 40px 0px 40px 0px;
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 24px;
      border: 1.5px solid var(--black2);
      position: relative;
    }
    .columns-wrapper {
      display: flex;
      flex-direction: row;
      gap: 32px;
      align-items: flex-start;
    }
    .left-column,
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .left-column {
      min-width: 300px;
    }
    .right-column {
      min-width: 300px;
    }
    label {
      font-family: 'Ubuntu', Arial, sans-serif;
      font-weight: 300;
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 0px;
      margin-top: 0px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      margin-top: 24px;
      margin-bottom: 4px;
    }
    .checkbox-group {
      display: flex;
      gap: 16px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .checkbox-group label {
      margin: 0;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      font-size: 16px; 
      color: var(--text);
      cursor: pointer;
      gap: 8px;
    }
    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      border-radius: 8px;
      margin-right: 4px;
      vertical-align: middle;
    }
    .total {
      margin-top: 62px;
      font-family: 'Ubuntu', Arial, sans-serif;
      font-weight: 300;
      font-size: 24px;
      color: var(--accent);
      text-align: left;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 0px;
    }
    .button-status-wrapper {
  display: flex;
  align-items: left;
}
    input[type="text"], input[type="text"], textarea {
      background: var(--black3);
      color: var(--text);
      border: 1px solid var(--grey2);
      border-radius: 20px;
      padding: 12px 8px;
      font-size: 16px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      transition: border 0.2s, background 0.4s;
      resize: none;
      height: 28px;
      -webkit-user-select: none; 
      -moz-user-select: none;    
      -ms-user-select: none;     
      user-select: none;
    }
    input[type="text"]:focus, input[type="text"]:focus, textarea:focus {
      border: 1px solid var(--myinterface);
      background: var(--black3);
      outline: none;
    }
    textarea {
      min-height: 72px;
      max-height: 180px;
      height: 28px;
    }
    button[type="submit"] {
      flex: none;
      color: var(--text);
      padding: 16px 32px;
      border: none;
      border-radius: 60px;
      border-color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 16px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 300;
      cursor: pointer;
      text-decoration: none;
      background: transparent;
      letter-spacing: 0.04em;
      margin-top: 24px;
      -webkit-user-select: none; 
      -moz-user-select: none;    
      -ms-user-select: none;     
      user-select: none;
    }
    button[type="submit"]:hover {
      border: 1px solid var(--accent);
      background: transparent; 
      color: var(--accent);
    }
    button[type="submit"]:active {
      border: 1px solid var(--myinterface);
  background: transparent; 
  color: var(--myinterface);                
  transform: scale(0.96);
    }
    .success {
    margin-top: 24px;
    background-color: var(--black3); 
    color: var(--mylogo); 
    font-family: 'DM Sans', Arial, sans-serif;
    font-weight: 300;
    font-size: 14px;
    margin-left: 12px;
}
.error {
    margin-top: 24px;
    margin-left: 12px;
    background-color: var(--black3); 
    color: var(--accent); 
    font-family: 'DM Sans', Arial, sans-serif;
    font-weight: 300;
    font-size: 14px;
}
.sending {
    margin-top: 24px;
    background-color: var(--black3); 
    color: var(--myinterface);
    font-family: 'DM Sans', Arial, sans-serif;
    font-weight: 300;
    font-size: 14px;
    margin-left: 12px;
}
    @media (max-width: 600px) {
      .calc-container {
        padding: 18px 4vw 18px 4vw;
        margin: 24px 0 16px 0;
        border-radius: 18px;
        max-width: 420px;
      }
      .columns-wrapper {
        flex-direction: column;
        gap: 24px;
      }
      .left-column,
      .right-column {
        min-width: auto;
      }
      .calc-title {
        font-size: 1.3em;
      }
      .total {
        font-size: 1.1em;
      }
      button[type="submit"] {
        font-size: 1em;
        padding: 12px 0;
      }
    }
  </style>
</head>
<body>
  <div class="calc-container">
    <div class="columns-wrapper">
      <div class="left-column">
        <label>Выберите количество страниц <br>и расчитайте примерную стоимость:<span id="pagesValue">1</span></label>
        <input type="range" id="pages" min="1" max="20" value="1">
        <div class="checkbox-group">
          <label><input type="checkbox" id="design"> Дизайн</label>
          <label><input type="checkbox" id="adaptive"> Адаптивность</label>
          <label><input type="checkbox" id="cms"> CMS (админка)</label>
          <label><input type="checkbox" id="seo"> SEO настройки</label>
        </div>
        <div class="total">Итого: <span id="total">0</span> ₽</div>
      </div>
      <div class="right-column">
        <form id="auditForm">
          <input type="text" name="name" placeholder="Имя">
          <input type="text" id="phone" placeholder="+7 (___) ___-__-__" maxlength="18" autocomplete="off">
          <textarea name="message" placeholder="Брифинг" rows="3"></textarea>
          <input type="hidden" name="pages_count" id="pages_count">
          <input type="hidden" name="design_selected" id="design_selected">
          <input type="hidden" name="adaptive_selected" id="adaptive_selected">
          <input type="hidden" name="cms_selected" id="cms_selected">
          <input type="hidden" name="seo_selected" id="seo_selected">
          <input type="hidden" name="total_cost" id="total_cost">
          <div class="button-status-wrapper"><button type="submit">Отправить</button>
          <div id="form-status"></div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    const pages = document.getElementById('pages');
    const pagesValue = document.getElementById('pagesValue');
    const design = document.getElementById('design');
    const adaptive = document.getElementById('adaptive');
    const cms = document.getElementById('cms');
    const seo = document.getElementById('seo');
    const total = document.getElementById('total');
    function calculate() {
      let cost = pages.value * 5000;
      if (design.checked) cost += 25000;
      if (adaptive.checked) cost += 43000;
      if (cms.checked) cost += 7000;
      if (seo.checked) cost += 15000;
      pagesValue.textContent = pages.value;
      total.textContent = cost.toLocaleString();
      document.getElementById('pages_count').value = pages.value;
      document.getElementById('design_selected').value = design.checked ? 'Да' : 'Нет';
      document.getElementById('adaptive_selected').value = adaptive.checked ? 'Да' : 'Нет';
      document.getElementById('cms_selected').value = cms.checked ? 'Да' : 'Нет';
      document.getElementById('seo_selected').value = seo.checked ? 'Да' : 'Нет';
      document.getElementById('total_cost').value = cost;
    }
    pages.addEventListener('input', calculate);
    design.addEventListener('change', calculate);
    adaptive.addEventListener('change', calculate);
    cms.addEventListener('change', calculate);
    seo.addEventListener('change', calculate);
    calculate();
    function closeModal() {
      document.getElementById('form-status').innerText = '';
      document.getElementById('auditForm').reset();
      calculate();
    }
document.getElementById('auditForm').onsubmit = async function(e) {
  e.preventDefault();
  const status = document.getElementById('form-status');
  status.className = 'sending';
  status.innerText = 'Отправка...';
  const form = e.target;
  let digits = form.phone.value.replace(/\D/g, '');
  if (digits.startsWith('7') || digits.startsWith('8')) {
    digits = digits.slice(1);
  }
  if (digits.length !== 10) {
    status.className = 'error';
    status.innerText = 'Заполните пожалуйста телефон полностью!';
    form.phone.focus();
    return;
  }
  const data = {
    name: form.name.value,
    phone: digits,
    message: form.message.value,
    pages_count: form.pages_count.value,
    design_selected: form.design_selected.value,
    adaptive_selected: form.adaptive_selected.value,
    cms_selected: form.cms_selected.value,
    seo_selected: form.seo_selected.value,
    total_cost: form.total_cost.value
  };
  try {
    const res = await fetch('/api/sendMail', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (res.ok) {
      status.className = 'success';
      status.innerText = 'Спасибо за заявку!';
      setTimeout(closeModal, 1500);
    } else {
      status.className = 'error';
      status.innerText = 'Ошибка при отправке. Попробуйте позже.';
    }
  } catch {
    status.className = 'error';
    status.innerText = 'Ошибка сети. Попробуйте позже.';
  }
};
const phoneInput = document.getElementById('phone');

    function applyMask(digits) {
      let output = '+7 (';
      output += digits.substring(0, 3);
      if (digits.length >= 3) {
        output += ') ';
        output += digits.substring(3, 6);
      }
      if (digits.length >= 6) {
        output += '-';
        output += digits.substring(6, 8);
      }
      if (digits.length >= 8) {
        output += '-';
        output += digits.substring(8, 10);
      }
      return output;
    }
    phoneInput.addEventListener('input', function(e) {
  let digits = this.value.replace(/\D/g, '');
  if (digits.startsWith('7') || digits.startsWith('8')) {
    digits = digits.slice(1);
  }
  digits = digits.slice(0, 10);
  let masked = '+7 (';
  if (digits.length > 0) masked += digits.substring(0, 3);
  if (digits.length >= 3) masked += ') ';
  if (digits.length >= 4) masked += digits.substring(3, 6);
  if (digits.length >= 6) masked += '-';
  if (digits.length >= 6) masked += digits.substring(6, 8);
  if (digits.length >= 8) masked += '-';
  if (digits.length >= 8) masked += digits.substring(8, 10);
  this.value = masked;
});
  </script>
</body>
</html>
