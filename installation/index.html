<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D фигура из полосок</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Устанавливаем черный фон
        scene.background = new THREE.Color(0x000000);

        // Создаем массив для хранения линий
        const geometry = new THREE.BufferGeometry();
        const positions = [];
        const count = 1000; // Количество линий
        const radius = 2; // Радиус фигуры

        // Исходные позиции для случайных линий
        const initialPositions = [];
        
        for (let i = 0; i < count; i++) {
            const angle1 = Math.random() * Math.PI * 2;
            const angle2 = Math.random() * Math.PI * 2;
            const x1 = radius * Math.cos(angle1);
            const y1 = radius * Math.sin(angle1);
            const z1 = Math.sin(angle1 * 5);

            const x2 = radius * Math.cos(angle2);
            const y2 = radius * Math.sin(angle2);
            const z2 = Math.sin(angle2 * 5);

            initialPositions.push(x1, y1, z1, x2, y2, z2);
            positions.push(x1, y1, z1, x2, y2, z2); // Начальные позиции
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

        // Создаем материал линий
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });

        // Создаем линию из геометрии и материала
        const lineSegments = new THREE.LineSegments(geometry, lineMaterial);
        scene.add(lineSegments);

        camera.position.z = 5;

        // Параметры для метаморфозы
        let morphing = false; // Флаг для изменения формы
        let progress = 0; // Прогресс метаморфозы (от 0 до 1)

        function animate() {
            requestAnimationFrame(animate);
            lineSegments.rotation.x += 0.01;
            lineSegments.rotation.y += 0.01;

            const positionAttribute = lineSegments.geometry.attributes.position.array;

            if (morphing) {
                // Плавная метаморфоза
                progress += 0.01; // Увеличение прогресса
                if (progress >= 1) {
                    progress = 1; // Ограничиваем прогресс
                    morphing = !morphing; // Меняем направление
                }

                // Линейная интерполяция между двумя формами
                for (let i = 0; i < positionAttribute.length; i += 6) {
                    const t = morphing ? Math.sin(progress * Math.PI / 2) : 1 - Math.sin(progress * Math.PI / 2);
                    
                    const angle = (i / 6) * 0.1;
                    
                    const x1 = initialPositions[i];
                    const y1 = initialPositions[i + 1];
                    const z1 = morphing ? Math.sin(angle * 5) * t : initialPositions[i + 2];
                    
                    const x2 = initialPositions[i + 3];
                    const y2 = initialPositions[i + 4];
                    const z2 = morphing ? Math.sin(angle * 5) * t : initialPositions[i + 5];

                    positionAttribute[i + 2] = z1; // z1 нового состояния
                    positionAttribute[i + 5] = z2; // z2 нового состояния
                }
            } else {
                // Условия для начала метаморфозы
                if (performance.now() % 2000 < 100) {
                    morphing = true; // Начинаем метаморфозу
                    progress = 0; // Сброс прогресса
                }
            }

            // Сообщаем THREE.js об изменении вершин
            lineSegments.geometry.attributes.position.needsUpdate = true;

            // Меняем цвет со временем
            lineMaterial.color.setHSL((performance.now() * 0.001) % 1, 1, 0.5);

            renderer.render(scene, camera);
        }

        animate();

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
