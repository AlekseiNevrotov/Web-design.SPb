<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Контакты студии</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    .contact-info {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .contact-info a {
      color: #000;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .social-links a {
      display: inline-block;
      margin-right: 1rem;
      margin-top: 1rem;
      padding: 0.5rem 0.75rem;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    .social-links a:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1>Связаться с нами</h1>

  <div class="contact-info">
    <p><strong>Email:</strong> <a href="mailto:hello@yourstudio.ru">hello@yourstudio.ru</a></p>
    <p><strong>Телефон:</strong> <a href="tel:+79991234567">+7 (999) 123-45-67</a></p>
    <p><strong>Адрес:</strong> Москва, ул. Примерная, д. 1</p>
  </div>

  <div class="social-links">
    <a href="https://t.me/yourstudio" target="_blank">Telegram</a>
    <a href="https://instagram.com/yourstudio" target="_blank">Instagram</a>
    <a href="https://behance.net/yourstudio" target="_blank">Behance</a>
  </div>
</body>
</html>
