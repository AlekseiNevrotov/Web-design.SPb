<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Контакты студии</title>
  <link rel="icon" href="/favicons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500;700&family=Ubuntu:wght@300;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mylogo: #26D9CD;
      --accent: #26C5D9;
      --myinterface: #16847D;
      --bg: #121212;
      --black2: #191919;
      --black3: #1C1C1C;
      --grey: #404040;
      --grey2: #666666;
      --text: #FFFFFF;
      --radius: 32px;
    }
    body {
      margin: 0;
      font-family: 'DM Sans', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 48px 16px 32px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Ubuntu', Arial, sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }
    .contact-info {
      background: var(--black3);
      border-radius: 20px;
      padding: 28px 24px 18px 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(38,217,205,0.07);
      border: 1.5px solid var(--black2);
      width: 100%;
      font-size: 1.08rem;
      line-height: 1.7;
    }
    .contact-info a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
      font-weight: 500;
    }
    .contact-info a:hover {
      color: var(--mylogo);
      text-decoration: underline;
    }
    .social-links {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .social-links a {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: var(--black2);
      color: var(--text);
      text-decoration: none;
      border-radius: 60px;
      border: 1.5px solid var(--accent);
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 500;
      font-size: 1rem;
      transition: background 0.2s, color 0.2s, border 0.2s;
      letter-spacing: 0.03em;
    }
    .social-links a:hover {
      background: var(--accent);
      color: var(--black3);
      border-color: var(--accent);
    }
    @media (max-width: 600px) {
      main {
        padding: 24px 4vw 24px 4vw;
      }
      h1 {
        font-size: 1.2em;
        margin-bottom: 20px;
      }
      .contact-info {
        padding: 14px 8px 10px 8px;
        border-radius: 14px;
        margin-bottom: 14px;
        font-size: 1em;
      }
      .social-links a {
        font-size: 0.98em;
        padding: 0.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Связаться с нами</h1>
    <div class="contact-info">
      <p><strong>Email:</strong> <a href="mailto:slim31240@inbox.ru">slim31240@inbox.ru</a></p>
      <p><strong>Телефон:</strong> <a href="tel:+79500143777">+7 (950) 014-37-77</a></p>
      <p><strong>Адрес:</strong> Санкт-Петербург</p>
    </div>
    <div class="social-links">
      <a href="https://t.me/yourstudio" target="_blank">Telegram</a>
      <a href="https://instagram.com/yourstudio" target="_blank">Instagram</a>
      <a href="https://behance.net/yourstudio" target="_blank">Behance</a>
    </div>
  </main>
</body>
</html>
