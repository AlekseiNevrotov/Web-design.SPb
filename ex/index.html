<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Учёт алиментов</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
    label, input, select, button { font-size: 1em; margin: 5px; }
    .result { margin-top: 20px; }
    table { margin-top: 20px; border-collapse: collapse; }
    td, th { border: 1px solid #666; padding: 5px 10px; }
  </style>
</head>
<body>
  <h1>Учёт алиментов</h1>
  <form id="alimonyForm">
    <label>Месяц: <input type="month" id="month" required></label>
    <label>Сумма: <input type="number" id="amount" min="0" required></label>
    <label>Детей: 
      <select id="children">
        <option value="1">1 ребёнок</option>
        <option value="2">2 ребёнка</option>
        <option value="3">3 ребёнка</option>
      </select>
    </label>
    <button type="submit">Добавить</button>
  </form>
  <div class="result" id="result"></div>
  <table id="history">
    <thead>
      <tr><th>Месяц</th><th>Сумма</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="alimony.js"></script>
</body>
</html>
